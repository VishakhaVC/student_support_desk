{% extends "base.html" %}
{% block title %}Sign in · Student Support AI{% endblock %}
{% block public %}
<div class="auth"><div class="auth-card">
  <div class="brand"><span class="brand-mark">SS</span><span>Student Support AI</span></div>
  <p class="lead">Sign in to continue</p>
  <div class="card">
    <form method="post" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="username" style="margin-top:0">Username</label>
      <input type="text" id="username" name="username" autocomplete="username" required autofocus>
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
      <p style="margin:18px 0 0"><button class="btn" style="width:100%" type="submit">Sign in</button></p>
    </form>
  </div>
</div></div>
{% endblock %}
